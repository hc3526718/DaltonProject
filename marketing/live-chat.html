<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Dalton Grant Academy — Live chat</title>
    <link rel="stylesheet" href="shared/theme.css" />
  </head>
  <body
    class="min-h-screen antialiased dalton-marketing"
    style="
      font-family: system-ui;
      background: #0a0a0a;
      color: #d4d0c8;
      margin: 0;
      padding: 0;
    "
  >
    <div style="padding: 1.5rem 1.25rem; max-width: 960px; margin: 0 auto">
      <h1 style="margin: 0; font-size: 1.25rem; letter-spacing: 0.08em; text-transform: uppercase">
        Live chat
      </h1>
      <p style="margin: 0.75rem 0 0; color: rgba(212, 208, 200, 0.8); line-height: 1.5">
        If you have questions, start here. For FAQs and guides, visit the
        <a style="color: #c8a84b" href="/help-center">Help centre</a>.
      </p>
    </div>

    <div style="padding: 0 1.25rem 2rem; max-width: 960px; margin: 0 auto">
      <div
        style="
          border: 1px solid rgba(200, 168, 75, 0.25);
          border-radius: 16px;
          overflow: hidden;
          background: rgba(255, 255, 255, 0.03);
        "
      >
        <iframe
          src="https://www.chatbase.co/chatbot-iframe/zEmQhZUYm1rliCblIg1mI"
          width="100%"
          style="height: 100%; min-height: 700px"
          frameborder="0"
          allow="microphone"
        ></iframe>
      </div>
    </div>

    <script src="shared/marketing-chrome.js"></script>
  </body>
</html>
